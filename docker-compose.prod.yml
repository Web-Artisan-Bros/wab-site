# Coolify deployment (build pack "Docker Compose", file /docker-compose.prod.yml).
# The site is archived: the contact form is off, so there is no queue worker.
# The database is the shared MySQL service in Coolify, reached through DB_HOST.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      # The image exposes 8080, 8443 and 9000: pin the HTTP port so Traefik never guesses
      - traefik.http.services.wab-site-app.loadbalancer.server.port=8080
      # An archived site: keep it out of search engines. A router of its own, above the ones
      # Coolify writes at every deploy, adds the X-Robots-Tag header on all the app's domains.
      - traefik.http.middlewares.noindex-wab.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.routers.noindex-wab.rule=Host(`wab.leicaflorianrobert.dev`) || Host(`en.wab.leicaflorianrobert.dev`) || Host(`ro.wab.leicaflorianrobert.dev`) || Host(`wab.164.90.206.43.sslip.io`)
      - traefik.http.routers.noindex-wab.entryPoints=https
      - traefik.http.routers.noindex-wab.tls=true
      - traefik.http.routers.noindex-wab.tls.certresolver=letsencrypt
      - traefik.http.routers.noindex-wab.priority=1000
      - traefik.http.routers.noindex-wab.middlewares=gzip,noindex-wab
      - traefik.http.routers.noindex-wab.service=wab-site-app
    environment:
      SERVICE_FQDN_APP_8080: ""
      APP_NAME: ${APP_NAME:-Web Artisan Bros}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      # SERVICE_URL_* carries the scheme, SERVICE_FQDN_* only the host
      APP_URL: ${SERVICE_URL_APP}
      # Locale subdomains are built on top of it (en.<domain>, ro.<domain>)
      APP_DOMAIN: ${APP_DOMAIN:-wab.leicaflorianrobert.dev}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-wab_site}
      DB_USERNAME: ${DB_USERNAME:-wab_site}
      DB_PASSWORD: ${DB_PASSWORD}
      QUEUE_CONNECTION: sync
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      # No outgoing mail while the site is archived
      MAIL_MAILER: log
      # Migrations and config/route/view cache at startup
      AUTORUN_ENABLED: "true"
    volumes:
      - storage-app:/var/www/html/storage/app

volumes:
  storage-app:
